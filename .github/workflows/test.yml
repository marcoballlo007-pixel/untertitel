name: App-Test
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Setup
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng ffmpeg > /dev/null
          pip install -q playwright psutil
          python -m playwright install --with-deps chromium webkit > /dev/null
      - name: Testvideos erzeugen
        run: |
          mkdir -p media out
          espeak-ng -v de -s 140 -w media/speech.wav "Hallo Leute, heute zeige ich euch meine neue App. Sie macht automatisch Untertitel aus jedem Video. Das ist richtig praktisch für TikTok."
          ffmpeg -loglevel error -y -f lavfi -i "color=c=0x3355aa:s=540x960:r=30" -i media/speech.wav -shortest -c:v libx264 -pix_fmt yuv420p -c:a aac media/speech.mp4
          ffmpeg -loglevel error -y -i media/speech.wav -f lavfi -i "sine=f=220:d=15" -f lavfi -i "sine=f=330:d=15" -filter_complex "[1][2]amix=2,volume=0.25[m];[0][m]amix=2:duration=first[a]" -map "[a]" media/song.wav
          ffmpeg -loglevel error -y -f lavfi -i "color=c=0xaa3355:s=540x960:r=30" -i media/song.wav -shortest -c:v libx264 -pix_fmt yuv420p -c:a aac media/song.mp4
          for i in 1 2 3 4 5 6; do echo "file 'song.wav'" ; done > media/list.txt
          ffmpeg -loglevel error -y -f concat -i media/list.txt media/long.wav
          ffmpeg -loglevel error -y -f lavfi -i "testsrc2=s=1080x1920:r=30" -i media/long.wav -shortest -c:v libx264 -preset veryfast -profile:v main -level 4.0 -b:v 6M -pix_fmt yuv420p -c:a aac -movflags +faststart media/long.mp4
          ls -la media
      - name: Server starten
        run: nohup python -m http.server 8000 > /dev/null 2>&1 &
      - name: App testen
        run: python tests/e2e.py
      - name: Bilder sichern
        if: always()
        run: |
          mkdir -p /tmp/r && cp out/*.png /tmp/r/ || true
          git config user.name test-bot && git config user.email bot@users.noreply.github.com
          git checkout --orphan test-results && git rm -rqf . && cp /tmp/r/*.png . || true
          git add -A && git commit -qm "Testbilder" && git push -f origin test-results || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: ergebnis, path: out/ }
